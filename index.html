<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="끝없이 몰려오는 망자 사이에서 20분을 버티는 탑뷰 생존 게임">
  <title lang="en">MIDNIGHT SURVIVORS</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/player.js" defer></script>
  <script src="game.js" defer></script>
  <script src="art.js" defer></script>
  <script src="sprites.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main id="game" aria-label="MIDNIGHT SURVIVORS">
    <canvas id="field" aria-label="묘지 전투 화면. WASD로 이동하고 마우스 왼쪽 버튼을 누른 채 연사합니다."></canvas>
    <header class="hud">
      <div id="time-track" class="time-track" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="1200" aria-valuenow="1200"><div id="time-fill"></div></div>
      <div class="hud-row">
        <div class="vitals">
          <div class="hud-label"><span class="heart">♥</span> 체력 <b id="hp-value">100 / 100</b></div>
          <div class="hp-track"><div id="hp-fill"></div></div>
          <div id="augments" class="weapons" role="group" aria-label="획득한 증강"></div>
          <div id="combo-status" class="combo-status" hidden></div>
        </div>
        <div class="clock">
          <span id="clock-label" class="clock-label">새벽까지</span>
          <strong id="time">20:00</strong>
          <span id="wave" class="wave-label">WAVE 01 <i></i> 20</span>
        </div>
        <div class="score">
          <div class="hud-label"><svg class="skull" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.8 0-8 3.3-8 7.4 0 3.2 1.7 5 4 6.1V21h8v-4.5c2.3-1.1 4-2.9 4-6.1C20 6.3 16.8 3 12 3Z"/><circle cx="8.5" cy="11" r="1.4"/><circle cx="15.5" cy="11" r="1.4"/><path d="m11 15 1-1 1 1m-1 3v3"/></svg> 처치 <b id="kills">0</b></div>
          <div id="augment-progress" class="augment-progress" hidden></div>
          <div id="enemy-strength" class="enemy-strength" hidden>적 강화 +30%</div>
        </div>
      </div>
    </header>

    <div class="encounter-hud">
      <div id="boss-hud" class="boss-hud" role="group" aria-label="전장에 남은 보스" hidden></div>
      <div id="boss-deadline" class="boss-deadline" hidden></div>
      <div id="announcement" class="announcement" aria-live="polite"></div>
    </div>
    <footer class="game-footer">
      <span><span class="live-dot"></span> 폐허가 된 묘지</span>
      <span class="desktop-hint"><kbd>W A S D</kbd> 이동 <span class="hint-divider">/</span> <kbd>좌클릭 유지</kbd> 연사<span id="ability-keys"></span></span>
      <div class="footer-actions">
        <button id="practice-reset" class="pause-button practice-reset" type="button" aria-label="테스트 초기화 (R)" title="테스트 초기화 (R)" hidden>↻</button>
        <button id="sound-toggle" class="pause-button sound-button" type="button" aria-label="효과음 끄기" title="효과음 끄기" aria-pressed="false">♪</button>
        <button id="pause" class="pause-button" type="button" aria-label="일시정지" title="일시정지" disabled><span></span><span></span></button>
      </div>
    </footer>

    <div id="overlay" class="overlay" data-screen="ready">
      <section class="panel" aria-labelledby="panel-title">
        <div class="sigil" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M31 8a17 17 0 1 0 8 26A15 15 0 0 1 23 10c2-1 5-2 8-2Z"/><path d="M36 7v12m-6-6h12M41 22v6m-3-3h6"/></svg></div>
        <div id="panel-tag" class="panel-tag" hidden></div>
        <h1 id="panel-title" lang="en">MIDNIGHT SURVIVORS</h1>
        <p id="panel-copy">망자들이 깨어났습니다.<br>새벽이 올 때까지 <b>20분</b>을 버티세요.</p>
        <div id="panel-stats" class="panel-stats" hidden></div>
        <div id="panel-detail" class="panel-detail" hidden></div>
        <button id="primary" type="button">플레이 <span aria-hidden="true">→</span></button>
        <button id="practice-start" class="panel-secondary" type="button">스킬 테스트 <small>모든 증강 5단계</small></button>
        <button id="practice-exit" class="panel-secondary" type="button" hidden>시작 화면으로</button>
        <p id="panel-hint" class="panel-hint"><kbd>WASD</kbd> 이동<span>·</span><kbd>좌클릭 유지</kbd> 연사</p>
      </section>
    </div>
    <div id="draft-overlay" class="draft-overlay" role="dialog" aria-modal="true" aria-labelledby="draft-title" aria-describedby="draft-copy" hidden>
      <section class="draft-panel">
        <header class="draft-header">
          <p class="panel-tag"><i></i><span id="draft-stage"></span><i></i></p>
          <h2 id="draft-title">증강 선택</h2>
          <p id="draft-copy">카드 한 장을 골라 기술을 얻거나 강화하세요.</p>
        </header>
        <div id="draft-options" class="draft-options"></div>
      </section>
    </div>
  </main>
</body>
</html>
